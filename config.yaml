# Configuration for the RGB-D + force-torque data-collection recorder.
# Loaded by mainAcquisition.py and passed into cameraHandler / forceHandler /
# dataWriter functions - nothing else in dataAcquisition/ hardcod
camera:
  # Valid (width, height) options for the D435 color stream: 320x180,
  # 320x240, 424x240, 640x360, 640x480, 848x480, 960x540, 1280x720, 1920x1080.
  # Supported fps per resolution: 6/15/30/60 for anything up to 960x540,
  # 6/15/30 only for 1280x720 and 1920x1080.
  # Color is captured as the camera's raw YUYV and depth unaligned; both are
  # written to Raw/ while recording and aligned/cropped offline
  # (offlineExtract.py), so a high color resolution no longer costs live fps.
  # Under WSL the camera goes through usbipd (USB/IP), which carries only
  # ~50 MB/s: measured 9.6 fps at 1920x1080, 18 fps at 1280x720, 29.6 fps at
  # 960x540 (each + 848x480 depth). For 1920x1080 @ 30 fps run
  # mainAcquisition.py natively on Windows (full USB3 bandwidth). The overlay
  # shows "camera drops" in red when the resolution is too high for the link.
  color:
    width: 960
    height: 540
    framerate: 30
    auto_exposure: false          # if false, exposure/gain below are used
    exposure: 100                 # D435 RGB: units of 100 us (100 = 10 ms), range 1-10000 (default 156) - verify in realsense-viewer
    gain: 64                      # range 0-128 (default 64); prefer more light over more gain (gain = noise)
    auto_white_balance: false
    white_balance: 3000           # Kelvin, range 2800-6500 in steps of 10 (default 4600); calibrate to the lamp with a grey card
    brightness: 0                 # range -64 to 64 (default 0)
    contrast: 50                  # range 0 to 100 (default 50)
  depth:
    width: 848
    height: 480
    framerate: 30
    depth_units_m: 0.0001         # meters per depth count (0.1 mm steps)
    emitter_enabled: true
    laser_power: 150              # range 0-360 in steps of 30 (default 150)
    visual_preset: high_accuracy  # "default" or "high_accuracy" (rs.rs400_visual_preset)
    # Depth is recorded raw: no on-device decimation/spatial/temporal/hole-filling
    # filters are applied here.

hand_tracking:
  model_path: ../hand_landmarker.task   # relative to dataAcquisition/
  tracked_hand_label: Left        # which hand to follow: "Left" or "Right"
  fingertip_landmark_index: 8     # MediaPipe index-fingertip landmark
  depth_validation_tolerance_m: 0.02  # maximum center-to-neighborhood depth difference
  depth_validation_radius_m: 0.015     # radius of the 8-point validation ring around the fingertip
  minimum_valid_depth_samples: 5       # minimum passing points required out of 8
  # Crop geometry (applied offline; the live preview shows an approximation).
  crop_output_px: 112             # both color and depth crops are crop_output_px x crop_output_px
  crop_side_mm: 40.0              # physical side length covered at the fingertip depth (old 112px@848 was ~50mm)
  anchor_dip_landmark_index: 7    # MediaPipe index DIP joint, defines the finger axis with the fingertip
  anchor_alpha: 0.4               # crop center = TIP - anchor_alpha * (TIP - DIP): moves the nail/pad to the middle
  rotate_to_finger_axis: false    # rotate crops so the finger always points up (reduces in-plane variation)
  # Live preview only
  live_preview_width: 640         # color frames are downscaled to this width for MediaPipe + display
  live_mediapipe_every_n: 2       # submit every n-th frame to MediaPipe
  show_tracked_crop: false         # live preview window of the color crop
  show_depth_preview: false        # live preview window of the (colorized) depth crop

force_sensor:
  # Only Fz (downward force) is used; Fx/Fy/Tx/Ty/Tz are discarded on arrival.
  ip: 192.168.1.1
  port: 49152
  counts_per_newton: 1000000.0
  calibration_interval_s: 3.0
  send_keepalive: false
  keepalive_interval_s: 15.0

output:
  # Relative paths are relative to dataAcquisition/.
  root: DataCollection/Data       # offlineExtract.py output (video.h5 etc.) for quick checks; training data comes from
                                  # preprocessing/dataProcessor.py (processing block below), which reads raw_root
  raw_root: DataCollection/Raw    # raw recordings (color.mkv, depth.mkv, ...); may point to an external disk, e.g. /mnt/e/Raw
  color_encoder: libx264          # "libx264" (CPU, 4:2:2) or "h264_nvenc" (GPU, 4:2:0)
  color_crf: 12                   # x264 CRF / nvenc QP: lower = better; 0 = lossless (much larger)
  writer_queue_frames: 90         # frames buffered per encoder before frames are dropped (~370 MB at 1080p)
  process_on_stop: true           # launch offlineExtract.py automatically when a recording stops
  delete_raw_after_processing: false  # remove Raw/session_x once Data/session_x is written successfully

offline:
  smoothing_window_frames: 9      # Savitzky-Golay window (odd) for the zero-phase trajectory smoothing
  smoothing_polyorder: 2
  max_gap_interp_frames: 3        # missing MediaPipe detections up to this many frames are interpolated
  save_only_valid_frames: true    # frames.csv holds only tracked, depth-validated frames (drops most no-contact frames -
                                  # the training data in data/processed keeps them, see the processing block)
  align_check_tolerance_counts: 5 # max |numpy align - rs.align| (depth counts) counted as agreement
  qc_strip_frames: 16             # consecutive crops shown in qc/crop_strip.png

# Configuration for the offline post-processor (postProcessing/postProcessor.py).
# Paths below are relative to the repo root (the directory this file lives in).
post_processing:
  input_root: dataAcquisition/DataCollection/Data
  output_root: postProcessing/ProcessedData/Data
  qc_subdir: QC
  force_filter:
    # Zero-phase Butterworth low-pass (scipy sosfiltfilt). 10-15 Hz keeps the
    # dynamics of a human press while removing sensor noise/mechanical
    # vibration; zero-phase means no delay is introduced, which matters
    # because these labels get resampled onto the frame timestamps.
    cutoff_hz: 12.0
    order: 4
  contact:
    # Hysteresis on the filtered |Fz| so the contact flag doesn't chatter
    # right at the threshold. Only Fz is measured by this rig (see
    # dataAcquisition/forceHandler.py), so "magnitude" here is |Fz|.
    on_threshold_n: 0.4
    off_threshold_n: 0.25
    min_anchor_duration_s: 1.0   # minimum no-contact span shown as a QC baseline anchor
  depth_cleaning:
    # Edge-preserving spatial filter + hole-filling, run on the full aligned
    # crop before it reaches the network. No SDK decimation (loses
    # resolution) or temporal filter (smears the moving finger, mixes in
    # history from outside the frame).
    median_ksize: 5               # odd; light median filter to knock down flying pixels
    inpaint_radius_px: 3
    inpaint_method: telea          # "telea" or "ns" (Navier-Stokes)
    max_depth_m: 0.30              # matches preprocessing/depth.py's MAX_DEPTH_M
    max_invalid_fraction_flag: 0.5 # frames with more originally-invalid area than this are flagged
  qc:
    dropped_frame_gap_multiple: 2.0   # a frame gap > this x the median interval counts as a drop event
    alignment_check_frame_count: 6    # number of frames rendered for the color/depth alignment check

# Configuration for the training-data preprocessor (preprocessing/dataProcessor.py),
# the RGB-D counterpart of ForceEstimationPressureVision's processing block:
# same force label (force_n = max(-Fz, 0)), same artifact rule, and every
# tracked frame is kept - also the ones without contact. Writes one folder per
# session to output_root, read by Model/ and Model2D/ (data_root there).
# Paths are relative to the repo root.
processing:
  raw_root: dataAcquisition/DataCollection/Raw   # session_* folders as written by mainAcquisition.py
  output_root: data/processed

  hand_tracking:
    model_path: hand_landmarker.task
    tracked_hand_label: null         # null = use meta_raw.json's hand_tracking.tracked_hand_label (the pressing hand)
    fingertip_landmark_index: 8      # MediaPipe index fingertip
    dip_landmark_index: 7            # MediaPipe index DIP joint (defines the finger axis)
    max_gap_interp_frames: 5         # missing detections up to this many frames are interpolated (as in PressureVision)
    smoothing_window_frames: 9       # Savitzky-Golay window (odd), zero-phase over every tracked run
    smoothing_polyorder: 2
    # 8-point fingertip depth check - only stored as frames.csv's
    # fingertip_depth_valid flag, it no longer decides which frames are saved.
    depth_validation_tolerance_m: 0.02
    depth_validation_radius_m: 0.015
    minimum_valid_depth_samples: 5

  crop:
    # Same geometry as the recorder's offline extractor (hand_tracking block
    # above), so the crops match the ones the models were developed on.
    side_mm: 40.0                    # physical side at the (smoothed, per-frame) fingertip depth
    output_px: 112
    anchor_alpha: 0.4                # crop center = TIP - anchor_alpha * (TIP - DIP)
    rotate_to_finger_axis: false
    max_outside_fraction: 0.25       # frames whose crop lies more than this far outside the image are dropped

  force:
    cutoff_hz: 12.0                  # zero-phase Butterworth low-pass before resampling onto frame timestamps
    order: 4
    frame_time_offset_ms: 0.0        # added to frame timestamps before looking up force (camera latency compensation)
    # Fz reads NEGATIVE while pressing; label force_n = max(-Fz, 0).
    # Fz above this is the forearm being lifted off the plate (end of every
    # session, +20..+40 N), not a press - those frames are flagged as artifacts.
    artifact_positive_n: 6.0
    artifact_margin_s: 0.5           # also flag this much time around every artifact

  depth_cleaning:
    # Per-frame hole filling of the depth crop (was done in Model*/dataset.py).
    inpaint_radius_px: 3
    median_ksize: 3                  # light edge-preserving filter after hole-filling

  align_check_tolerance_counts: 5
  qc_strip_frames: 16

# Configuration for the fingertip force estimator (Model/dataset.py, model.py,
# train.py, mainModel.py). Reads the sessions preprocessing/dataProcessor.py
# wrote (processing block above). Paths are relative to the repo root (this file's directory).
model_training:
  data_root: data/processed
  splits:
    # By session, never by window - overlapping windows from one recording
    # landing in two splits would make the test error meaningless. Every
    # PROCESSED_OK session in data_root is shuffled with split_seed and
    # divided by these fractions; the resolved lists are saved as
    # <checkpoint_dir>/splits.json and in best_model.pt.
    train_fraction: 0.70
    val_fraction: 0.15
    test_fraction: 0.15
    split_seed: 0
    # Optional manual override (a missing key means an empty split):
    # train_sessions: [session_20261002_112827, ...]
  window:
    length: 20            # frames per clip, temporal stride 1
    train_stride: 3        # window-start stride when building the training index
    eval_stride: 1          # window-start stride for val/test (dense, no overlap skipped)
    # Window rules. Always applied as well: no frame of the window may be a
    # force artifact (forearm lift-off, see processing.force).
    max_span_s: 0.8           # contiguity: reject a window if first-to-last-frame time exceeds this
                              # (20 frames at 30 fps = 0.63 s, so this allows ~5 missing frames)
    max_label_force_n: 30.0   # reject a window whose label exceeds this (PressureVision's max_force_n)
    max_force_change_n: null  # optional: reject if |force(last) - force(first)| exceeds this; null = off
  label:
    force_norm_scale_n: 20.0   # normalized_label = force_n / this; predictions convert back by multiplying
  depth:
    clip_mm: 40.0                    # per-window relative-depth channel is clipped to +/- this, then divided by it
  augmentation:
    horizontal_flip_prob: 0.5
    temporal_offset_max_frames: 2      # window start shifted by up to +/- this many frames, label shifted to match
    rotation_enabled: false             # off by default - try only if val/train loss gap shows overfitting
    rotation_max_deg: 8.0
    depth_noise_enabled: false           # off by default - see rotation_enabled
    depth_noise_std_mm: 0.25
  loader:
    batch_size: 16
    num_workers: 4
  training:
    loss:
      huber_delta_n: 1.5   # HuberLoss delta, in newtons (converted to normalized units at runtime)
    optimizer:
      head_lr: 1.0e-3
      layer4_lr: 1.0e-4
      layer3_lr: 3.0e-5
      stem_lr: 1.0e-4
      weight_decay: 1.0e-3   # not applied to biases or normalization (BatchNorm) parameters
    schedule:
      warmup_epochs: 1.5      # linear warmup, then cosine decay to 0 - both stepped per optimizer step
    effective_batch_size: 16   # gradient accumulation makes up the gap if loader.batch_size is smaller
    max_epochs: 60
    early_stopping_patience: 10  # epochs without a val MAE improvement before stopping
    grad_clip_max_norm: 1.0
    seed: 42                     # seeds python/numpy/torch (head init, dropout, shuffle order, augmentation)
    deterministic: false         # true = bit-identical GPU runs (deterministic cuDNN/cuBLAS kernels), slower
    checkpoint_dir: Model/checkpoints
    metrics_history_file: metrics_history.csv

# Configuration for the single-frame (2D CNN) force estimator (Model2D/), used
# to test whether the 3D CNN in Model/ is needed. Self-contained: nothing here
# reads model_training above. Every value except the backbone-specific ones
# starts as a copy of model_training, so the two runs differ only in the
# temporal dimension - keep splits/window/label/depth in sync with
# model_training when comparing, or the comparison is no longer like-for-like
# (same fractions + split_seed over the same data_root = the same split).
model2d_training:
  data_root: data/processed
  splits:
    # By session, never by window - overlapping windows from one recording
    # landing in two splits would make the test error meaningless. Every
    # PROCESSED_OK session in data_root is shuffled with split_seed and
    # divided by these fractions; the resolved lists are saved as
    # <checkpoint_dir>/splits.json and in best_model.pt.
    train_fraction: 0.70
    val_fraction: 0.15
    test_fraction: 0.15
    split_seed: 0
    # Optional manual override (a missing key means an empty split):
    # train_sessions: [session_20261002_112827, ...]
  window:
    # The 2D model only ever sees the window's label (centre) frame. The window
    # is still built and filtered exactly as in model_training, so both models
    # are trained and scored on the same label frames.
    length: 20
    train_stride: 3
    eval_stride: 1
    max_span_s: 0.8
    max_label_force_n: 30.0
    max_force_change_n: null
  label:
    force_norm_scale_n: 20.0
  depth:
    clip_mm: 40.0                    # relative to the frame's own median valid depth
  augmentation:
    horizontal_flip_prob: 0.5
    temporal_offset_max_frames: 2      # picks a neighbouring label frame (and its label) instead
    rotation_enabled: false
    rotation_max_deg: 8.0
    depth_noise_enabled: false
    depth_noise_std_mm: 0.25
  loader:
    batch_size: 16
    num_workers: 4
  training:
    loss:
      huber_delta_n: 1.5
    optimizer:
      head_lr: 1.0e-3
      layer4_lr: 1.0e-4
      layer3_lr: 3.0e-5
      stem_lr: 1.0e-4                # resnet18 conv1 + bn1
      weight_decay: 1.0e-3
    schedule:
      warmup_epochs: 1.5
    effective_batch_size: 16
    max_epochs: 60
    early_stopping_patience: 10
    grad_clip_max_norm: 1.0
    seed: 42
    deterministic: false
    checkpoint_dir: Model2D/checkpoints
    metrics_history_file: metrics_history.csv

# Configuration for comparison/compareModels.ipynb: scores the 3D, 2D and
# PressureVision models on the test frames they all predicted. Every entry
# under models is a list of globs of eval_test folders (written by each
# project's evaluate.py / mainModel.py), one per trained run - all matching
# runs of a model are averaged and their spread is reported. Paths are
# relative to the repo root.
comparison:
  output_dir: comparison/results
  data_root: data/processed            # labels, timestamps (force rate) and training frames (trivial baseline)
  models:
    3D: [Model/checkpoints/eval_test, Model/checkpoints/seed_*/eval_test]
    2D: [Model2D/checkpoints/eval_test, Model2D/checkpoints/seed_*/eval_test]
    PressureVision: [../ForceEstimationPressureVision/Model/checkpoints/eval_test,
                     ../ForceEstimationPressureVision/Model/checkpoints/*_seed_*/eval_test]
  contact_threshold_n: 0.5             # contact = force > this (PressureVision's contact_threshold_n)
  max_label_force_n: 30.0              # for the trivial baseline's training frames
  dynamic_force_rate_n_per_s: 10.0     # |dF/dt| above this = press onset / release ("dynamic" frames)
  force_bins_n: [0.5, 2.0, 5.0, 10.0, 15.0, 30.0]
  bootstrap_samples: 5000              # resamples of the test sessions
  bootstrap_seed: 0
  benchmark:
    # Inference cost per force prediction (compareModels.ipynb, RUN_BENCHMARK
    # = True). Each model is built from its checkpoint (by default
    # best_model.pt next to its first evaluated run) and timed on random
    # inputs of its own size; code_dir is the folder with its model.py.
    models:
      3D: {kind: clip3d, code_dir: Model}
      2D: {kind: frame2d, code_dir: Model2D}
      PressureVision: {kind: pressurevision, code_dir: ../ForceEstimationPressureVision/Model}
    device: cuda                     # "cuda" (falls back to cpu if unavailable) or "cpu"
    precision: autocast              # "autocast" = bf16/fp16 as in training and evaluation, or "fp32"
    batch_size: 16                   # for the throughput / memory numbers
    warmup_iterations: 20
    timed_iterations: 100
    also_cpu: true                   # additionally time batch 1 on the CPU (deployment without a GPU)
    cpu_threads: 4
    cpu_timed_iterations: 20
    camera_fps: 30                   # real-time budget = 1000 / camera_fps ms per prediction
